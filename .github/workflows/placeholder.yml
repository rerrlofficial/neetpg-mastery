name: Foundation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f packages/shared/question.ts
          test -f supabase/migrations/001_initial_schema.sql
